<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>إدارة سكينة</title>
<style>:root{--bg:#F3F1EB;--sf:#F9F7F2;--tx:#58554C;--t2:#77736A;--sd:#6A7866;--ln:#E4E0D5;--on:#F9F7F2}
@media (prefers-color-scheme:dark){:root{--bg:#252A25;--sf:#2C312C;--tx:#D0CCC0;--t2:#908D80;--sd:#A2B19C;--ln:#373D36;--on:#232823}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 system-ui,"Segoe UI",Tahoma,sans-serif;padding:18px;max-width:560px;margin:auto}
h1{font-size:24px;color:var(--sd)}.c{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:12px 0}h2{font-size:18px;margin:0 0 8px;color:var(--sd)}
textarea,input{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px;font:inherit}
button{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer}button.on{background:var(--sd);color:var(--on);border-color:var(--sd)}
.r{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0}small{color:var(--t2)}</style></head><body>
<h1>لوحة إدارة سكينة</h1>
<div class="c"><small>هذه الصفحة تُجهّز ملف config.json فقط. بعد التنزيل ارفعه مكان الملف القديم في موقعك لتظهر التغييرات للجميع. اجعل رابط هذه الصفحة سرًّا، أو احذفها من الموقع عند عدم الحاجة.</small></div>
<div class="c"><h2>رسالة للمستخدمين</h2><textarea id="a" rows="3"></textarea><small>تظهر أعلى شاشة المواقيت. اتركها فارغة لإخفائها.</small></div>
<div id="k"></div>
<div class="c r"><button class="on" id="dl">تنزيل config.json</button><button id="cp">نسخ المحتوى</button></div>
<div class="c"><small id="st">جارٍ تحميل الإعدادات الحالية…</small></div>
<script>
const K=['الصباح','المساء','بعد الصلاة','يومية'];let D={a:'',x:{},h:{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
function draw(){$('#a').value=D.a;$('#k').innerHTML=K.map((k,i)=>`<div class="c"><div class="r"><h2>أذكار ${k}</h2><button data-h="${i}" class="${D.h[k]?'':'on'}">${D.h[k]?'مخفي':'ظاهر'}</button></div>${(D.x[k]||[]).map((x,j)=>`<div class="r"><span>${esc(x[0])} (${x[1]})</span><button data-d="${i}|${j}">حذف</button></div>`).join('')}<input id="t${i}" placeholder="نص ذكر جديد"><div class="r"><input id="n${i}" placeholder="عدد التكرار" inputmode="numeric" style="width:130px"><button data-a="${i}">إضافة</button></div></div>`).join('')}
document.addEventListener('click',e=>{const t=e.target;if(!t.dataset)return;D.a=$('#a').value;
if(t.dataset.h!=null){const k=K[+t.dataset.h];D.h[k]=!D.h[k];draw()}
else if(t.dataset.d){const[i,j]=t.dataset.d.split('|');D.x[K[+i]].splice(+j,1);draw()}
else if(t.dataset.a!=null){const i=+t.dataset.a,v=$('#t'+i).value.trim();if(!v)return;(D.x[K[i]]=D.x[K[i]]||[]).push([v,Math.max(1,parseInt($('#n'+i).value)||1)]);draw()}});
const out=()=>{D.a=$('#a').value;return JSON.stringify(D,null,1)};
$('#dl').onclick=()=>{const u=URL.createObjectURL(new Blob([out()],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='config.json';a.click()};
$('#cp').onclick=()=>navigator.clipboard.writeText(out()).then(()=>$('#st').textContent='تم النسخ.').catch(()=>$('#st').textContent='تعذّر النسخ، استخدم التنزيل.');
fetch('config.json?'+Date.now()).then(r=>r.json()).then(d=>{D={a:d.a||'',x:d.x||{},h:d.h||{}};$('#st').textContent='تم تحميل الإعدادات الحالية.'}).catch(()=>$('#st').textContent='بدأنا بإعدادات فارغة.').finally(draw);
</script></body></html>
